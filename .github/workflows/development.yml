name: Development build

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

jobs:
  build:
    name: Development build
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: List files (Diagnostic)
        run: ls -R

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '8'

      - name: Install Tools
        run: |
          brew install dpkg ldid
          echo "THEOS=/tmp/theos" >> $GITHUB_ENV

      - name: Build IPA
        run: |
          export PLATFORM='ios'
          # We are listing files above to find where build.sh is. 
          # Once you verify the path in the logs, we will update this.
          echo "Checking for build.sh..."
          [ -f build.sh ] && echo "build.sh exists in root" || echo "build.sh NOT found in root"
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Amethyst-iOS-Fixed
          path: |
            *.ipa
            packages/*.ipa
