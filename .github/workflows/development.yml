name: Development build

on:
  workflow_dispatch:

jobs:
  build:
    name: Development build
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '8'

      - name: Install Tools
        run: brew install dpkg ldid

      - name: Build IPA
        run: make package PLATFORM=ios
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Amethyst-iOS-Fixed
          path: packages/*.ipa
