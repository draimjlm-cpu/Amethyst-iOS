name: Development build

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

jobs:
  build:
    name: Development build
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Find Build Scripts
        run: find . -name "*build*"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '8'

      - name: Install Tools
        run: |
          brew install dpkg ldid
          echo "THEOS=/tmp/theos" >> $GITHUB_ENV

      - name: Build IPA
        run: |
          echo "Waiting for correct build script..."
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Amethyst-iOS-Fixed
          path: |
            *.ipa
            packages/*.ipa
